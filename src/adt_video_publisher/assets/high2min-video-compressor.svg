<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">High2Min Video Compressor icon</title>
  <desc id="description">A play button inside a video frame with two arrows pointing inward to represent video compression.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="1" stop-color="#0b4161"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2b4"/>
      <stop offset="1" stop-color="#31b7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020b16" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#background)"/>
  <rect x="67" y="67" width="890" height="890" rx="192" fill="none" stroke="#75f2d1" stroke-opacity=".18" stroke-width="10"/>
  <g filter="url(#shadow)">
    <rect x="274" y="296" width="476" height="432" rx="108" fill="#0b213a" stroke="#edfaff" stroke-width="30"/>
    <rect x="328" y="350" width="368" height="324" rx="66" fill="#102f4b" stroke="#49dcca" stroke-opacity=".42" stroke-width="8"/>
    <path d="M457 421c0-21 23-34 42-23l139 91c17 11 17 36 0 47l-139 90c-19 12-42-1-42-22z" fill="url(#accent)"/>
  </g>
  <path d="M174 388l112 124-112 124" fill="none" stroke="url(#accent)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M850 388L738 512l112 124" fill="none" stroke="url(#accent)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="840" r="24" fill="#75f2d1" opacity=".86"/>
</svg>
