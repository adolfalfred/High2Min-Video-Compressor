name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv python3-tk xvfb libx11-6 libxft2 libxss1

      - name: Install project
        if: runner.os != 'Linux'
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install project with system Tk on Linux
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -e .

      - name: Run Windows and macOS unit tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: Run Linux unit tests
        if: runner.os == 'Linux'
        run: .ci-venv/bin/python -m unittest discover -s tests -v

      - name: Validate Windows and macOS automation contract
        if: runner.os != 'Linux'
        run: python -m adt_video_publisher contract --json

      - name: Validate Linux automation contract
        if: runner.os == 'Linux'
        run: .ci-venv/bin/python -m adt_video_publisher contract --json

      - name: Test Linux desktop UI
        if: runner.os == 'Linux'
        run: xvfb-run -a .ci-venv/bin/python -m adt_video_publisher ui --smoke-test

      - name: Test Windows and macOS desktop UI
        if: runner.os != 'Linux'
        run: python -m adt_video_publisher ui --smoke-test
